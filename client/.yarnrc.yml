# Yarn 4. node_modules (not Plug'n'Play): vite, protoc-gen-es and biome run from node_modules/.bin.
nodeLinker: node-modules
enableTelemetry: false
# @backplane-labs and @gopherex live in GitHub Packages; the token is in the user's ~/.yarnrc.yml
# (CI: yarn config set --home npmScopes.<scope>.npmAuthToken "$NODE_AUTH_TOKEN").
npmScopes:
  backplane-labs:
    npmRegistryServer: https://npm.pkg.github.com
  gopherex:
    npmRegistryServer: https://npm.pkg.github.com
