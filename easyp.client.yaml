# TypeScript of the client protocol (proto/pushgate/client), for the npm
# package @backplane-labs/pushgate-client (client/). Run through `make gen`.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
generate:
  inputs:
    - directory:
        path: pushgate/client
        root: proto
  plugins:
    - name: es
      out: client/src/gen
      opts:
        target: ts
