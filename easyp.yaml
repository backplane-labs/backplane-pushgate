# Proto lint and Go code of pushgate's client protocol. Run through `make gen`.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
