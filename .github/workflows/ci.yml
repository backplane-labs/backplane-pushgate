name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: make configure configure-client
      - run: bin/golangci-lint run ./...
      - run: make gen && git diff --exit-code -- proto client/src/gen
      - run: make client
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 15m ./...
